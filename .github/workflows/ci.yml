name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # pull-requests: read   # Needed for SonarCloud PR decoration — re-enable when switching to CI-based analysis (requires JaCoCo)

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 0 is required by SonarCloud CI-based analysis for new-code detection — re-enable with JaCoCo

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests
        run: ./gradlew test

      # - name: Analyze with SonarCloud
      #   # Disabled: SonarCloud Automatic Analysis is active (no CI-based scan needed).
      #   # Re-enable once JaCoCo is configured to send coverage data to SonarCloud.
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   run: ./gradlew sonar
