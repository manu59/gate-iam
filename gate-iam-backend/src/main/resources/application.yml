spring:
  application:
    name: gate-iam
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gate_iam}
    username: ${DB_USERNAME:gate_iam}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
